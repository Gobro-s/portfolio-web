name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio-web
          NEXT_PUBLIC_SITE_URL: https://gobro-s.github.io/portfolio-web
      # 잘라낸 폰트 CSS가 실제로 나간 한글을 전부 덮는지. 빠지면 그 글자만 시스템 폰트로
      # 떨어지는데 화면에서 알아채기 어렵다 — 배포 전에 여기서 막는다.
      - run: npm run check:fonts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
